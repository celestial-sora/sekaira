name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify production schema contract
        run: |
          grep -q "ADD COLUMN IF NOT EXISTS email" supabase/migrations/20260916080000_harden_runtime_schema.sql
          grep -q "characters ADD COLUMN IF NOT EXISTS published" supabase/migrations/20260916080000_harden_runtime_schema.sql
          grep -q "worlds ADD COLUMN IF NOT EXISTS published" supabase/migrations/20260916080000_harden_runtime_schema.sql
